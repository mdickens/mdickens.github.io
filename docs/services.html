<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marcdickenson.com</title>
    <style>
        /* Basic Styling */
        body {
            background-image: url('./b12.png');
            background-size: cover; /* Ensures the image covers the entire viewport */
            background-repeat: no-repeat; /* Prevents the image from repeating */
            background-attachment: fixed; /* Optional: Keeps the background fixed while scrolling */


            margin: 0;
            font-family: sans-serif;
        }

        .navbar {
            background-color: rgba(51, 51, 51, 0.8); /* Add some transparency for better readability over the background */
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo a {
            color: white;
            text-decoration: none;
            font-size: 1.5em;
            font-weight: bold;
        }

        .menu {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .menu li {
            margin-left: 20px;
        }

        .menu li a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .menu li a:hover {
            background-color: #555;
        }

        .hamburger {
            display: none; /* Hidden by default on larger screens */
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
        }

        .bar {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 5px auto;
            transition: all 0.3s ease-in-out;
        }

        /* Responsive Design (for smaller screens) */
        @media (max-width: 768px) {
            .menu {
                display: none; /* Hide the full menu */
                flex-direction: column;
                position: absolute;
                top: 60px; /* Adjust based on navbar height */
                left: 0;
                background-color: #333;
                width: 100%;
                text-align: center;
                box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
                z-index: 10; /* Ensure it's above other content */
            }

            .menu.active {
                display: flex; /* Show the menu when active class is added */
            }

            .menu li {
                margin: 0;
                padding: 15px 0;
                border-bottom: 1px solid #555;
            }

            .menu li:last-child {
                border-bottom: none;
            }

            .menu li a {
                display: block;
                width: 100%;
            }

            .hamburger {
                display: block; /* Show the hamburger menu */
            }

            .hamburger.active .bar:nth-child(1) {
                transform: translateY(8px) rotate(45deg);
            }

            .hamburger.active .bar:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active .bar:nth-child(3) {
                transform: translateY(-8px) rotate(-45deg);
            }
        }
a {
  color: #007bff; /* A common bright blue color */
}

a:visited {
  color: #8653B9; /* A purple for visited links (optional) */
}

a:hover {
  color: #0056b3; /* A slightly darker blue on hover (optional) */
}

a:active {
  color: #003366; /* An even darker blue when the link is being clicked (optional) */
}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="#">marcdickenson.com</a></div>
        <ul class="menu">
            <li><a href="./home.html">Home</a></li>
            <li><a href="./about.html">About</a></li>
            <li><a href="./services.html">Services</a></li>
            <li><a href="./portfolio.html">Portfolio</a></li>
            <li><a href="./contact.html">Contact</a></li>
        </ul>
        <button class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </nav>

    <script>
        const hamburger = document.querySelector('.hamburger');
        const menu = document.querySelector('.menu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            menu.classList.toggle('active');
        });

        // Optional: Close menu when a link is clicked (for better UX on mobile)
        document.querySelectorAll('.menu a').forEach(item => {
            item.addEventListener('click', () => {
                hamburger.classList.remove('active');
                menu.classList.remove('active');
            });
        });
    </script>

    <div style="padding: 20px; text-align: center; color: white;">
        <h1>Welcome to Marc Dickenson's Services Page</h1>
        <p>"The greatest scientists are artists as well" - Albert Einstein</p>
    </div>
	<hr>
    <div style="padding: 20px; text-align: center; color: white;">
        <h1><a href=./services.blog.html>My Blog</a></h1>
    </div>
</body>
</html>
